<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>售后服务助手｜工作台</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#eceef1;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
    .canvas{min-height:100vh;display:grid;place-items:center;padding:24px}
    .workbench{position:relative;width:390px;max-width:100%;container-type:inline-size;background:#f5f6fa;box-shadow:0 18px 45px rgba(28,34,41,.18)}
    .workbench-image{display:block;width:100%;height:auto}
    .activity-entry{position:absolute;left:64.7%;top:23.5%;width:29.3%;height:7.1%;display:flex;flex-direction:column;align-items:center;gap:3.7cqw;padding:0;color:#898b89;text-decoration:none;-webkit-tap-highlight-color:transparent;border-radius:8px}
    .activity-entry svg{display:block;flex:none;width:6.65cqw;height:6.65cqw;color:#111310}
    .activity-entry span{font-size:3.1cqw;line-height:1.4;white-space:nowrap}
    .activity-entry:hover{background:rgba(0,0,0,.025)}
    .activity-entry:focus-visible{outline:2px solid #315efb;outline-offset:4px}
    .sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
    .home-link{position:fixed;right:20px;bottom:20px;z-index:10;padding:10px 16px;border-radius:999px;background:#315efb;color:#fff;font-size:14px;font-weight:600;text-decoration:none;box-shadow:0 8px 24px rgba(49,94,251,.25)}
    @media(max-width:430px){body{background:#f5f6fa}.canvas{display:block;padding:0;min-height:100dvh}.workbench{width:100%;max-width:390px;margin:0 auto;box-shadow:none}.home-link{right:12px;bottom:88px;font-size:12px;padding:8px 12px}}
  </style>
</head>
<body>
  <div class="canvas">
    <main class="workbench">
      <h1 class="sr-only">售后服务助手工作台</h1>
      <img class="workbench-image" src="assets/images/sa-workbench.jpg" width="1170" height="2532" alt="售后服务助手工作台。Hi，郑小妹，服务顾问。欢迎使用东风日产售后服务助手。快捷入口：权益核销、商城订单。底部导航：工作台、我的。">
      <a class="activity-entry" href="index.html#sa-select" aria-label="一人一码">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx=".7"/>
          <rect x="16" y="2" width="6" height="6" rx=".7"/>
          <rect x="2" y="16" width="6" height="6" rx=".7"/>
          <path d="M5 5h0M19 5h0M5 19h0" stroke-width="2.5"/>
          <path d="M11 2v4M11 10h3M2 11h5M10.5 16v5"/>
          <circle cx="18" cy="13.5" r="2.2"/>
          <path d="M14.5 22v-1.5a3.5 3.5 0 0 1 7 0V22"/>
        </svg>
        <span>一人一码</span>
      </a>
    </main>
  </div>
  <a class="home-link" href="https://shevy-z.github.io/activity-center-prototypes/index.html" data-activity-home-button>← 返回首页</a>
</body>
</html>
